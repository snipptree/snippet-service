apiVersion: apps/v1
kind: Deployment
metadata:
  name: snippet-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: snippet-service
  template:
    metadata:
      labels:
        app: snippet-service
    spec:
      containers:
      - name: snippet-service
        image: 727646499255.dkr.ecr.ap-south-1.amazonaws.com/snippet-service:latest
        resources:
          requests: 
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        ports:
        - containerPort: 80  # snippet service runs on port 80
---
apiVersion: v1
kind: Service
metadata:
  name: snippet-service
spec:
  selector:
    app: snippet-service
  ports:
    - protocol: TCP
      port: 80  # Internal cluster port (no external access)
      targetPort: 80  # Port that the pod listens on
